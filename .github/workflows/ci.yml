name: CI

on:
  push:
    branches: [dev, qas, main]
  pull_request:
    branches: [dev, qas, main]

jobs:
  api:
    name: API - Build, Test & Sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-crud-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Testes + cobertura
        run: mvn -B verify

      - name: Análise Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar

  ui:
    name: UI - Build, Test & Sonar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-crud-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: npm ci

      - name: Testes + cobertura
        run: npm test -- --coverage

      - name: Análise Sonar
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: student-crud-ui
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
